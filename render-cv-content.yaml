    summary:
      - "Chief Technical Officer of a small start-up looking for opportunities to lead & grow well-operating technical teams while designing cutting edge systems.
      Wide ranging technical skills with particular strength in Python & cloud infrastructure, built upon a background in geophysical research, a drive to solve problems, and experience in leadership roles."

    experience:
      - company: "Xtract360"
        position: "Chief Technical Officer"
        start_date: "2018-08"
        end_date: "present"
        location: "Remote"
        summary: "_A small insurance technology start-up working on claims reconstruction that formed in 2017 and saw its first commercial success in early 2020._
          _Our systems now handle 15,000 claims monthly across 35 global clients, and capture approximately 45% of the Irish motor insurance market by claim volume._"
        highlights:
          - "Architected, secured, and operationalised the company's sole commercial asset."
          - "Built & led a team of nine from scratch across five functions (development, data science, product & design, quality assurance, and technical operations), creating a loyal team culture with only one staff departure after their first anniversary over seven years."
          - "Created & drove the company's technical recruitment plan, including the simultaneous recruitment for four roles in December 2023 & January 2024, allowing us to replace external contractors and save £14,000/mo."
          - "Unblocked a £40,000/mo contract with a global top-three vehicle rental group by preparing technical & internal IT operations for SOC 2 audit within three months."
          - "Migrated platform infrastructure from AWS to Azure, to enable our inclusion in the Microsoft Accelerator Program, while simultaneously defining the stack in Terraform to allow robust customer data segregation through the deployment of multiple identical environments."
          - "Designed & built an asynchronous task worker stack that monitors 17,000 connected devices every hour."
          - "Implemented a product roadmap & planning function which delivered six flagship features annually, while maintaining the operational flexibility to handle urgent customer onboarding demands and continuous code/product improvement work."
          - "Improved developer productivity tracking & timesheet data quality by creating an AI tool chain which examines Jira activity and prompts developers for time allocations before feeding the data to sprint burndown & timesheet records."
          - "Completed the technical onboarding, platform configuration, and integration set-up for ten customers within two months, following the surprise departure of our Head of Onboarding."
          - "Created technical and operational processes for managing & deploying platform changes automatically and eliminating recurring manual errors, at one point handling fourteen deployments in a week to clear an onboarding backlog."

