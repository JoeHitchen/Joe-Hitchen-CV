        position: "Data Scientist"
        start_date: "2017-12"
        end_date: "2018-08"
        location: "Remote"
        highlights:
          - "Built on exploratory academic consultancy work to develop patented crash detection algorithms that still form the core of our crash detection processing to this day."
          - "Converted trial implementations from R to Python, NumPy, & SciPy to enable integration with web systems."

